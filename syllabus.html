<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEET 2027 • Syllabus Tracker — Salaar</title>
<style>
:root{--bg:#f2f6f4;--paper:#fff;--ink:#17364a;--muted:#71818a;--line:#dce6e5;--soft:#edf5f3;--done:#dceee7;--accent:#78a99f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding:26px;background:linear-gradient(135deg,#f2f6f4,#fbfcfa 48%,#edf4f4);color:var(--ink);font-family:"Avenir Next","Segoe UI",Arial,sans-serif}.app{max-width:1500px;margin:auto}.sheet{background:#ffffffdf;border:1px solid #d5e1df;border-radius:24px;box-shadow:0 14px 45px #203e4614;overflow:hidden}.hero{padding:34px 38px 25px}.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#527384}.heroRow{display:flex;justify-content:space-between;gap:30px;align-items:flex-start}.title{margin:8px 0 3px;font:500 46px Georgia,serif;letter-spacing:.09em}.subtitle{font-size:13px;letter-spacing:.26em;color:#71838b;text-transform:uppercase}.sig{min-width:230px;background:var(--soft);border:1px solid #d9e7e4;border-radius:16px;padding:16px 18px;color:#48666f}.sig small{font-size:10px;letter-spacing:.18em;text-transform:uppercase}.sig strong{display:block;font:500 22px Georgia,serif;margin-top:4px}.sig span{font-size:11px;color:#74878d}.controls{margin:0 38px 22px;padding:13px;background:#f5f8f7;border:1px solid var(--line);border-radius:15px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}.tab,button{border:1px solid #d4dfde;background:white;color:#365766;border-radius:11px;padding:9px 14px;font:inherit;font-size:12px;cursor:pointer}.tab.active,.tab:hover,button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}.search{margin-left:auto;min-width:230px;border:1px solid #d4dfde;border-radius:11px;padding:9px 12px;background:white;outline:none}.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 38px 24px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:14px 16px}.stat label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#789098}.stat strong{display:block;font-size:25px;margin-top:3px}.bar{height:5px;background:#e6eeec;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:.3s}.subject{display:none;padding:0 38px 30px}.subject.active{display:block}.subHead{display:flex;justify-content:space-between;align-items:end;margin:4px 0 14px}.subTitle{font:500 26px Georgia,serif;letter-spacing:.08em}.meta{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#819197}.wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:white}table{border-collapse:separate;border-spacing:0;width:100%;min-width:930px;table-layout:fixed}th,td{border-right:1px solid #e5eceb;border-bottom:1px solid #e5eceb;text-align:center}th{height:48px;background:#edf5f4;color:#4b6874;font-size:9px;letter-spacing:.13em;text-transform:uppercase}td{height:39px;font-size:11px;color:#385665}th:first-child,td:first-child{width:48px}th.chapter,td.chapter{text-align:left;width:240px}td.chapter{padding:7px 12px;letter-spacing:.04em}th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}.check{cursor:pointer}.check:before{content:"";display:inline-block;width:12px;height:12px;border:1px solid #b8c7c6;border-radius:3px;vertical-align:middle}.check:hover{background:#f4f8f7}.check.on{background:var(--done)}.check.on:before{content:"✓";font-size:9px;line-height:12px;color:#3f786c;border-color:#8ab3aa;font-weight:700}.chapterName{display:flex;align-items:center;gap:8px}.dot{width:5px;height:5px;border-radius:50%;background:#b7cfca}.complete .dot{background:#6da99a}.complete .chapterName{color:#54786f}.hidden{display:none}.foot{margin:0 38px;padding:18px 0 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.quote{font:16px Georgia,serif;color:#52716f}.quote small{display:block;font-size:11px;color:#89989a;margin-top:4px;letter-spacing:.08em}.actions{display:flex;gap:8px}@media(max-width:850px){body{padding:10px}.hero,.controls,.dash,.subject{padding-left:18px;padding-right:18px}.foot{margin:0 18px}.heroRow{display:block}.sig{margin-top:18px}.title{font-size:34px}.dash{margin-left:18px;margin-right:18px;grid-template-columns:repeat(2,1fr)}.controls{margin-left:18px;margin-right:18px}.search{margin-left:0;flex:1;min-width:180px}}@media print{body{background:white;padding:0}.sheet{box-shadow:none;border:0}.controls,.dash,.actions{display:none}.hero{padding:15px}.subject{display:block!important;padding:0 15px 15px}.foot{margin:0 15px}.wrap{overflow:visible}table{min-width:0}th{height:30px;font-size:7px}td{height:25px;font-size:8px}.title{font-size:30px}}
</style></head><body><main class="app"><div class="sheet">
<header class="hero"><div class="eyebrow">NEET 2027 / SYLLABUS CONTROL</div><div class="heroRow"><div><div class="title">STUDY PLAN</div><div class="subtitle">Small steps · Big results</div></div><div class="sig"><small>Personal tracker</small><strong>~Salaar</strong><span>discipline today · results tomorrow</span></div></div></header>
<div class="controls"><button class="tab active" data-s="chem">Chemistry</button><button class="tab" data-s="phy">Physics</button><button class="tab" data-s="bio">Biology</button><button id="all" class="tab">All subjects</button><input id="search" class="search" placeholder="Search chapter…"><button id="print">Print</button><button id="reset">Reset current</button></div>
<section class="dash"><div class="stat"><label>Chapters</label><strong id="chap">0</strong></div><div class="stat"><label>Completed chapters</label><strong id="donechap">0</strong></div><div class="stat"><label>Overall progress</label><strong id="pct">0%</strong><div class="bar"><i id="bar"></i></div></div><div class="stat"><label>Checklist done</label><strong id="checks">0 / 0</strong></div></section>
<div id="subjects"></div>
<footer class="foot"><div class="quote">Keep going. One chapter at a time.<small>CHEM: LECTURE → NOTES → REVISION → TEST → PYQ · PHY: + KPP · BIO: NCERT → TRACE → FEEL → MIB → CTC</small></div><div class="actions"><button onclick="scrollTo({top:0,behavior:'smooth'})">Back to top</button></div></footer>
</div></main>
<script>
const D={
chem:{name:"CHEMISTRY",cols:["Lecture","Class Notes","Revision","Test","NEET PYQ","NCERT Intext","NCERT Exercise","NCERT Exemplar","KPP","R1","R2","R3"],ch:["Mole Concept","Redox","Solution","Thermodynamics","Equilibrium","Chemical Kinetics","Electrochemistry","Atomic Structure","Periodic Table","Chemical Bonding","Coordination Compound","P-Block","D & F-Block","Salt Analysis","IUPAC","Isomerism","GOC","Hydrocarbon","Haloalkane & Haloarene","Alcohol, Phenol & Ether","Aldehyde, Ketone & Carboxylic Acid","Amines","Biomolecules","Physical Practical Chem","Organic Practical Chem"]},
phy:{name:"PHYSICS",cols:["Lecture","Class Notes","Revision","Test","NEET PYQ","NCERT Intext","NCERT Exercise","NCERT Exemplar","KPP","R1","R2","R3"],ch:["Basic Math","Vector","Units and Measurements","Motion in a Straight Line","Motion in a Plane","Laws of Motion","Work, Energy and Power","COM","System of Particles and Rotational Motion","Gravitation","Mechanical Properties of Solids","Mechanical Properties of Fluids","Thermal Properties of Matter","Thermodynamics","Kinetic Theory","Oscillations","Waves","Electric Charges and Fields","Electrostatic Potential and Capacitance","Current Electricity","Moving Charges and Magnetism","Magnetism and Matter","Electromagnetic Induction","Alternating Current","Electromagnetic Waves","Ray Optics","Wave Optics","Modern Physics","Atoms","Nuclei","Semiconductor Electronics"]},
bio:{name:"BIOLOGY",cols:["NCERT","TRACE","FEEL","MIB","CTC","TEST - 2","TEST - 3","R - 1","R - 2","R - 3"],ch:["Breathing","Blood","Excretion","Locomotion","Endocrine","Human Reproduction","Reproductive Health","Biotech - I","Biotech - II","Human Health","Cell Unit","Cell Cycle","Biological Classification","Genetic - I","Genetic - II","Microbes","Angiosperm","Plant Kingdom","Morphology","Anatomy","Living World","Neural","Frog","Animal Kingdom","Biomolecule","Photosynthesis","Respiration","Plant Growth","Evolution","Organism and Population","Biodiversity","Ecology"]}
};
const K="neet_salaar_tracker_v2",S=JSON.parse(localStorage.getItem(K)||'{"x":{}}'); S.x=S.x||{};
const key=(s,r,c)=>s+"|"+r+"|"+c,save=()=>localStorage.setItem(K,JSON.stringify(S));
function build(s){let d=D[s];return `<section class="subject ${s=="chem"?"active":""}" id="${s}"><div class="subHead"><div><div class="subTitle">${d.name}</div><div class="meta">${d.ch.length} chapters · NEET 2027 tracker</div></div><div class="meta" id="p-${s}">0%</div></div><div class="wrap"><table><thead><tr><th>SR.</th><th class="chapter">CHAPTER NAME</th>${d.cols.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${d.ch.map((n,r)=>`<tr data-r="${r}" data-name="${n.toLowerCase()}"><td>${r+1}.</td><td class="chapter"><div class="chapterName"><span class="dot"></span>${n}</div></td>${d.cols.map((_,c)=>`<td class="check" data-s="${s}" data-r="${r}" data-c="${c}" tabindex="0"></td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`}
document.getElementById("subjects").innerHTML=["chem","phy","bio"].map(build).join("");
const CORE={
  chem:["Lecture","Class Notes","Revision","Test","NEET PYQ"],
  phy:["Lecture","Class Notes","Revision","Test","NEET PYQ","KPP"],
  bio:["NCERT","TRACE","FEEL","MIB","CTC"]
};
function refresh(){
  let T=0,O=0,C=0;
  for(let s in D){
    let d=D[s],so=0,core=CORE[s];
    d.ch.forEach((_,r)=>{
      let rowCore=0;
      d.cols.forEach((col,c)=>{
        let on=!!S.x[key(s,r,c)];
        let e=document.querySelector(`[data-s="${s}"][data-r="${r}"][data-c="${c}"]`);
        e.classList.toggle("on",on);
        T++;
        if(on){O++;so++;}
        if(core.includes(col) && on) rowCore++;
      });
      let done=rowCore===core.length;
      document.querySelector(`#${s} tr[data-r="${r}"]`).classList.toggle("complete",done);
      if(done) C++;
    });
    let totalChecks=d.ch.length*d.cols.length;
    document.getElementById("p-"+s).textContent=Math.round(so/totalChecks*100)+"% checked";
  }
  let totalCore=Object.keys(D).reduce((a,s)=>a+D[s].ch.length*CORE[s].length,0);
  let donePct=totalCore?Math.round((Object.keys(D).reduce((a,s)=>{
    let d=D[s],core=CORE[s];
    return a+d.ch.filter((_,r)=>core.every(col=>S.x[key(s,r,d.cols.indexOf(col))])).length;
  },0)/Object.values(D).reduce((a,d)=>a+d.ch.length,0))*100):0;
  document.getElementById("chap").textContent=Object.values(D).reduce((a,d)=>a+d.ch.length,0);
  document.getElementById("donechap").textContent=C;
  document.getElementById("checks").textContent=O+" / "+T;
  document.getElementById("pct").textContent=donePct+"%";
  document.getElementById("bar").style.width=donePct+"%";
  filter();
}
function filter(){let q=document.getElementById("search").value.toLowerCase().trim();document.querySelectorAll("tr[data-r]").forEach(r=>r.classList.toggle("hidden",q&&!r.dataset.name.includes(q)))}
document.addEventListener("click",e=>{let c=e.target.closest(".check");if(c){let k=key(c.dataset.s,+c.dataset.r,+c.dataset.c);S.x[k]=!S.x[k];save();refresh()}});
document.addEventListener("keydown",e=>{let c=e.target.closest(".check");if(c&&(e.key=="Enter"||e.key==" ")){e.preventDefault();c.click()}});
document.querySelectorAll(".tab[data-s]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".subject").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.s).classList.add("active")});
document.getElementById("all").onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById("all").classList.add("active");document.querySelectorAll(".subject").forEach(x=>x.classList.add("active"))};
document.getElementById("search").oninput=filter;document.getElementById("print").onclick=()=>print();
document.getElementById("reset").onclick=()=>{let b=document.querySelector(".tab.active[data-s]");if(!b)return alert("Open a subject first.");if(confirm("Reset all checkmarks for "+D[b.dataset.s].name+"?")){Object.keys(S.x).forEach(k=>{if(k.startsWith(b.dataset.s+"|"))delete S.x[k]});save();refresh()}};
refresh();
</script></body></html>
