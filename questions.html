<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Log</title><style>:root{--i:#183447;--m:#71818a;--l:#dbe4e3}*{box-sizing:border-box}body{margin:0;padding:18px;background:linear-gradient(135deg,#f2f6f4,#fbfcfa 55%,#edf4f4);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.p{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--l);padding:8px 4px 18px}.e{font-size:10px;letter-spacing:.22em;color:#607782}.t{font:500 36px Georgia,serif;margin:5px 0}.sub{font-size:11px;color:var(--m);letter-spacing:.12em}.month{border:1px solid var(--l);background:#fff;border-radius:10px;padding:10px;font:inherit}.sum,.cards{display:grid;gap:10px}.sum{grid-template-columns:repeat(5,1fr);margin:14px 0}.stat,.card{background:#fff;border:1px solid var(--l);border-radius:15px;padding:15px}.stat label{font-size:9px;letter-spacing:.14em;color:var(--m);text-transform:uppercase}.stat b{display:block;font-size:22px;margin-top:5px}.cards{grid-template-columns:repeat(3,1fr)}.card h2{font:500 20px Georgia,serif;margin:0 0 14px}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.field label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--m);margin-bottom:5px}.field input{width:100%;border:1px solid var(--l);border-radius:9px;padding:10px;font:inherit;background:#fbfcfb}.hint{font-size:9px;color:#8a989a;margin-top:10px}@media(max-width:850px){.top{flex-direction:column;align-items:start}.sum,.cards{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr 1fr}}@media(max-width:500px){.sum,.cards{grid-template-columns:1fr}.t{font-size:30px}}</style></head><body><div class="p"><header class="top"><div><div class="e">NEET 2027 / QUESTION ANALYSIS</div><div class="t">Question Log</div><div class="sub">Physics · Chemistry · Biology</div></div><input id="month" class="month" type="month"></header><section class="sum"><div class="stat"><label>Total Questions</label><b id="t">0</b></div><div class="stat"><label>Correct</label><b id="c">0</b></div><div class="stat"><label>Incorrect</label><b id="w">0</b></div><div class="stat"><label>Skipped</label><b id="s">0</b></div><div class="stat"><label>Accuracy</label><b id="a">—</b></div></section><main id="cards" class="cards"></main><div class="hint">Each month has its own log. Questions, Correct, Incorrect and Skipped are independent for Physics, Chemistry and Biology.</div></div><script>
var subs=["Physics","Chemistry","Biology"],month=document.getElementById("month"),cards=document.getElementById("cards");
function K(){return "neet_question_log_v1_"+month.value}
function load(){var d={};try{d=JSON.parse(localStorage.getItem(K())||"{}")}catch(e){}cards.innerHTML="";subs.forEach(function(s){var x=d[s]||{},card=document.createElement("section");card.className="card";card.innerHTML="<h2>"+s+"</h2><div class='fields'></div><div class='hint'>Accuracy —</div>";var f=card.querySelector(".fields");["questions","correct","incorrect","skipped"].forEach(function(k){var q=document.createElement("div");q.className="field";q.innerHTML="<label>"+k+"</label><input type='number' min='0' inputmode='numeric' value='"+(Number(x[k])||0)+"'>";q.querySelector("input").oninput=function(){d[s]=d[s]||{};d[s][k]=Math.max(0,Number(this.value)||0);localStorage.setItem(K(),JSON.stringify(d));update()};f.appendChild(q)});cards.appendChild(card)});update()}
function update(){var T=0,C=0,W=0,S=0;subs.forEach(function(s){var card=cards.children[subs.indexOf(s)],v=card.querySelectorAll("input"),q=Number(v[0].value)||0,c=Number(v[1].value)||0,w=Number(v[2].value)||0,sk=Number(v[3].value)||0,att=Math.max(0,q-sk);T+=q;C+=c;W+=w;S+=sk;card.querySelector(".hint").textContent=att?"Attempted "+att+" · Accuracy "+(c/att*100).toFixed(1)+"%":"Accuracy —"});var att=Math.max(0,T-S);document.getElementById("t").textContent=T;document.getElementById("c").textContent=C;document.getElementById("w").textContent=W;document.getElementById("s").textContent=S;document.getElementById("a").textContent=att?(C/att*100).toFixed(1)+"%":"—"}
var now=new Date();month.value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");month.onchange=load;load();window.addEventListener("storage",load);
</script></body></html>
