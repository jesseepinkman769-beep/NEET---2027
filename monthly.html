<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monthly Targets</title><style>:root{--i:#183447;--m:#71818a;--l:#dbe4e3;--a:#68857d}*{box-sizing:border-box}body{margin:0;padding:18px;background:linear-gradient(135deg,#f2f6f4,#fbfcfa 55%,#edf4f4);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.p{max-width:1250px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--l);padding:8px 4px 18px;gap:15px}.e{font-size:10px;letter-spacing:.22em;color:#607782}.t{font:500 36px Georgia,serif;margin:5px 0}.sub{font-size:11px;color:var(--m);letter-spacing:.12em;text-transform:uppercase}.month,.new{border:1px solid var(--l);background:#fff;border-radius:10px;padding:10px;font:inherit}.summary,.grid{display:grid;gap:10px}.summary{grid-template-columns:1.5fr repeat(3,1fr);margin:14px 0}.stat,.card{background:#fff;border:1px solid var(--l);border-radius:15px;padding:15px}.stat label{font-size:9px;letter-spacing:.15em;color:var(--m);text-transform:uppercase}.stat b{display:block;font-size:25px;margin-top:5px}.bar{height:5px;background:#e7eeec;border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--a)}.grid{grid-template-columns:repeat(2,1fr)}.card h2{font:500 19px Georgia,serif;margin:0 0 10px}.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #edf1f0;font-size:11px}.item span{flex:1}.done span{text-decoration:line-through;color:#8a989a}.row{display:flex;gap:7px;margin-top:9px}.new{flex:1;font-size:11px}.btn{border:1px solid #d5e0de;background:#fff;color:#365766;border-radius:9px;padding:9px 11px;cursor:pointer}.btn:hover{background:var(--i);color:#fff}.del{border:0;background:none;color:#9aa6a7;cursor:pointer}.foot{font-size:9px;color:#8a989a;margin-top:12px}@media(max-width:800px){.top{flex-direction:column;align-items:start}.summary,.grid{grid-template-columns:1fr}.t{font-size:30px}}</style></head><body><div class="p"><header class="top"><div><div class="e">NEET 2027 / PLANNING</div><div class="t">Monthly Targets</div><div class="sub">One month · one clear execution board</div></div><input id="month" class="month" type="month"></header><section class="summary"><div class="stat"><label>Monthly Progress</label><b id="pct">0%</b><div class="bar"><i id="bar"></i></div></div><div class="stat"><label>Total Targets</label><b id="total">0</b></div><div class="stat"><label>Completed</label><b id="done">0</b></div><div class="stat"><label>Remaining</label><b id="rem">0</b></div></section><main id="grid" class="grid"></main><div class="foot">Every month has its own independent targets. Changing the month never overwrites another month.</div></div><script>
var subjects=["Physics","Physical Chemistry","Organic Chemistry","Inorganic Chemistry","Zoology","Botany","Tests"],month=document.getElementById("month"),grid=document.getElementById("grid");
function K(){return "neet_monthly_targets_v1_"+month.value} function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function load(){var d={};try{d=JSON.parse(localStorage.getItem(K())||"{}")}catch(e){} grid.innerHTML="";subjects.forEach(function(s){var arr=Array.isArray(d[s])?d[s]:[],card=document.createElement("section");card.className="card";card.innerHTML="<h2>"+esc(s)+"</h2><div class='items'></div><div class='row'><input class='new' placeholder='Add a monthly target'><button class='btn'>Add</button></div>";var items=card.querySelector(".items");arr.forEach(function(x,i){var el=document.createElement("div");el.className="item"+(x.done?" done":"");el.innerHTML="<input type='checkbox' "+(x.done?"checked":"")+"><span>"+esc(x.text)+"</span><button class='del'>×</button>";el.querySelector("input").onchange=function(){d[s][i].done=this.checked;save(d);load()};el.querySelector(".del").onclick=function(){d[s].splice(i,1);save(d);load()};items.appendChild(el)});var input=card.querySelector(".new");card.querySelector(".btn").onclick=function(){var text=input.value.trim();if(!text)return;d[s]=arr;d[s].push({text:text,done:false});save(d);load()};input.onkeydown=function(e){if(e.key==="Enter")card.querySelector(".btn").click()};grid.appendChild(card)});update()}
function save(d){localStorage.setItem(K(),JSON.stringify(d))}
function update(){var n=0,d=0;document.querySelectorAll(".item").forEach(function(x){n++;if(x.querySelector("input").checked)d++});var p=n?Math.round(d/n*100):0;document.getElementById("pct").textContent=p+"%";document.getElementById("bar").style.width=p+"%";document.getElementById("total").textContent=n;document.getElementById("done").textContent=d;document.getElementById("rem").textContent=n-d}
var now=new Date();month.value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");month.onchange=load;load();window.addEventListener("storage",load);
</script></body></html>
